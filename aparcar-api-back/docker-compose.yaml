services:
  db:
    build:
      context: .
      dockerfile: dockerfiles/db.Dockerfile
    ports:
      - '5433:5432'
    restart: always
    env_file:
      - .env
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-q", "-U", "postgres"]
      interval: 30s
      timeout: 30s
      retries: 8
  server:
    build:
      context: .
      dockerfile: dockerfiles/server.Dockerfile
    ports:
      - '8080:8080'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_volume:

              - column: { name: numero, value: "A-01" }
              - column: { name: sector, value: "Planta Baja" }
              - column: { name: tipo, value: "AUTO" }
              - column: { name: estado, value: "HABILITADA" }
        - insert:
            tableName: cocheras
            columns:
              - column: { name: id, value: "b1a7c2b0-1111-4a1a-9c1a-000000000002" }
              - column: { name: numero, value: "A-02" }
              - column: { name: sector, value: "Planta Baja" }
              - column: { name: tipo, value: "AUTO" }
              - column: { name: estado, value: "HABILITADA" }
        - insert:
            tableName: cocheras
            columns:
              - column: { name: id, value: "b1a7c2b0-1111-4a1a-9c1a-000000000003" }
              - column: { name: numero, value: "M-01" }
              - column: { name: sector, value: "Sector Motos" }
              - column: { name: tipo, value: "MOTO" }
              - column: { name: estado, value: "HABILITADA" }
        - insert:
            tableName: cocheras
            columns:
              - column: { name: id, value: "b1a7c2b0-1111-4a1a-9c1a-000000000004" }
              - column: { name: numero, value: "C-01" }
              - column: { name: sector, value: "Sector Carga" }
              - column: { name: tipo, value: "CARGA" }
              - column: { name: estado, value: "HABILITADA" }
        - insert:
            tableName: cocheras
            columns:
              - column: { name: id, value: "b1a7c2b0-1111-4a1a-9c1a-000000000005" }
              - column: { name: numero, value: "AC-01" }
              - column: { name: sector, value: "Entrada Principal" }

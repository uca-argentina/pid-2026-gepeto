spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: password

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        hbm2ddl.import_files: planificacion-test.sql
  sql:
    init:
      platform: h2

  mail:
    host: localhost
    port: 1025
    username: mail1@tmp.com
    password: 1234 5678 9012 3456

aparcar:
  acceso:
    # Los tests de integracion comparten el filtro entre clases: el limite real
    # se prueba aparte, en AccesoRateLimitFilterTests.
    rate-limit-por-minuto: 100000
  discapacidad:
    # Dentro de target/: se borra con mvn clean y nunca entra al repo.
    documentos-dir: target/test-discapacidad-docs
    notificar-por-mail: false
    # El limite real se prueba aparte, en VerificacionRateLimitFilterTests.
    subidas-por-hora: 100000
